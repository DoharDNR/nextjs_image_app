<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Split card layout</title>

  <!-- Set theme before first paint to avoid a flash: saved choice, else system preference -->
  <script>
    try {
      const saved = localStorage.getItem("theme");
      const dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.classList.toggle("dark", dark);
    } catch (e) {}
  </script>

  <!-- Tailwind v4 browser build (for production, use the Tailwind CLI instead) -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <style type="text/tailwindcss">
    /* Class-based dark mode: <html class="dark"> */
    @custom-variant dark (&:where(.dark, .dark *));

    /* Monochrome tokens: swap values per theme, use the same class names everywhere */
    :root {
      --paper: #f5f5f5;
      --card: #ffffff;
      --ink: #171717;
      --mute: #737373;
      --line: #d4d4d4;
      --img: #a3a3a3;
    }
    .dark {
      --paper: #0a0a0a;
      --card: #171717;
      --ink: #f5f5f5;
      --mute: #a3a3a3;
      --line: #333333;
      --img: #404040;
    }

    @theme inline {
      --color-paper: var(--paper);
      --color-card: var(--card);
      --color-ink: var(--ink);
      --color-mute: var(--mute);
      --color-line: var(--line);
      --color-img: var(--img);
      --font-sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    /* Hide the default disclosure marker in Safari */
    summary::-webkit-details-marker { display: none; }
  </style>
</head>

<body class="bg-paper font-sans text-ink antialiased transition-colors duration-200">

  <!-- Theme switcher -->
  <button id="theme-toggle" type="button" aria-label="Switch to dark mode"
    class="fixed right-4 top-4 z-10 grid size-11 place-items-center rounded-full border border-line bg-card text-ink transition hover:border-ink focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ink sm:right-8 sm:top-8">
    <svg class="size-5 dark:hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
    </svg>
    <svg class="hidden size-5 dark:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="4" />
      <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
    </svg>
  </button>

  <main class="mx-auto flex min-h-screen max-w-6xl items-center p-4 pt-20 sm:p-8 sm:pt-24">

    <!-- Mobile: stacked (flex-col). Desktop (lg+): side by side (flex-row) -->
    <article class="flex w-full flex-col overflow-hidden rounded-2xl border border-line bg-card lg:flex-row">

      <!-- LEFT: accordion (<details> lets multiple items stay open at once) -->
      <section class="flex flex-1 flex-col justify-center p-6 sm:p-10 lg:p-14">
        <h1 class="mb-6 text-3xl font-semibold tracking-tight sm:text-4xl">Good to know</h1>

        <div class="divide-y divide-line border-y border-line">

          <details class="group py-1" open>
            <summary class="flex cursor-pointer list-none items-center justify-between gap-4 rounded py-4 text-lg font-medium focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ink">
              First question goes here
              <svg class="size-5 shrink-0 transition-transform duration-200 group-open:rotate-180" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg>
            </summary>
            <p class="pb-4 leading-relaxed text-mute">
              Answer text for the first item. Replace this with your own content.
            </p>
          </details>

          <details class="group py-1">
            <summary class="flex cursor-pointer list-none items-center justify-between gap-4 rounded py-4 text-lg font-medium focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ink">
              Second question goes here
              <svg class="size-5 shrink-0 transition-transform duration-200 group-open:rotate-180" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg>
            </summary>
            <p class="pb-4 leading-relaxed text-mute">
              Answer text for the second item. Replace this with your own content.
            </p>
          </details>

          <details class="group py-1">
            <summary class="flex cursor-pointer list-none items-center justify-between gap-4 rounded py-4 text-lg font-medium focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ink">
              Third question goes here
              <svg class="size-5 shrink-0 transition-transform duration-200 group-open:rotate-180" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg>
            </summary>
            <p class="pb-4 leading-relaxed text-mute">
              Answer text for the third item. Replace this with your own content.
            </p>
          </details>

        </div>
      </section>

      <!-- RIGHT: one tall image. Fills the full height of the card on desktop.
           Swap the placeholder div for: <img src="…" alt="…" class="absolute inset-0 size-full object-cover"> -->
      <section class="relative min-h-72 flex-1 sm:min-h-96 lg:min-h-0">
        <div class="absolute inset-0 bg-img" role="img" aria-label="Card image"></div>
      </section>

    </article>
  </main>

  <script>
    const root = document.documentElement;
    const btn = document.getElementById("theme-toggle");

    const sync = () => {
      const dark = root.classList.contains("dark");
      btn.setAttribute("aria-label", dark ? "Switch to light mode" : "Switch to dark mode");
    };
    sync();

    btn.addEventListener("click", () => {
      const dark = root.classList.toggle("dark");
      try { localStorage.setItem("theme", dark ? "dark" : "light"); } catch (e) {}
      sync();
    });
  </script>
</body>
</html>
